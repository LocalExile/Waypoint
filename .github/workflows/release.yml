# A version tag (v1.2.3) publishes a release: the tests, then Waypoint.exe built with that version and its SHA-256, attached
# to a GitHub release of the tag. Waypoint's update check reads the latest one (Updates.cs). GitHub runs this file as it was in
# the tagged commit, so the check below guards tags on commits from its own on, never an older one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a new version from main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api 'repos/${{ github.repository }}/releases/latest' --jq .tag_name
          git merge-base --is-ancestor HEAD origin/main
          $onMain = $LASTEXITCODE -eq 0
          ./tools/check-release-tag.ps1 -Tag '${{ github.ref_name }}' -Latest "$latest" -OnMain:$onMain
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag $tag is not v<major>.<minor>.<patch>" }
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test Waypoint.slnx -c Release
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Waypoint -c Release -o out -p:Version=${{ steps.version.outputs.number }}
          $hash = (Get-FileHash out/Waypoint.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/out/Waypoint.exe.sha256", "$hash  Waypoint.exe`n")
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}' out/Waypoint.exe out/Waypoint.exe.sha256
          --title 'Waypoint ${{ steps.version.outputs.number }}' --generate-notes --verify-tag
          --notes 'Download **Waypoint.exe** below and run it; a Waypoint you already have offers this version itself. The Source code archives are added by GitHub to every release and are not needed to run it.'
