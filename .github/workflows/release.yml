# A version tag (v1.2.3) publishes a release: the tests, then LocalExileLauncher.exe built with that version and its
# SHA-256, attached to a GitHub release of the tag. The launcher's update check reads the latest one (Updates.cs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag $tag is not v<major>.<minor>.<patch>" }
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test LocalExileLauncher.slnx -c Release
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/GameServer.Launcher -c Release -o out -p:Version=${{ steps.version.outputs.number }}
          $hash = (Get-FileHash out/LocalExileLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/out/LocalExileLauncher.exe.sha256", "$hash  LocalExileLauncher.exe`n")
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}' out/LocalExileLauncher.exe out/LocalExileLauncher.exe.sha256
          --title 'LocalExile Launcher ${{ steps.version.outputs.number }}' --generate-notes --verify-tag
          --notes 'Download **LocalExileLauncher.exe** below and run it; a launcher you already have offers this version itself. The Source code archives are added by GitHub to every release and are not needed to run it.'
