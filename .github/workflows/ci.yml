# Every push to main and every pull request: the solution builds without warnings, the tests and the adapter's checks pass,
# and all interface text has a translation in every catalog.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build Waypoint.slnx -c Release
      - name: Test
        run: dotnet test Waypoint.slnx -c Release --no-build
      - name: Core checks
        run: dotnet run --project tests/Launcher.Checks -c Release --no-build
      - name: Adapter checks
        shell: pwsh
        run: |
          foreach ($test in 'Bridge', 'Mods', 'ModControl', 'ModBrowser', 'ContentBridge', 'ModTransport', 'Source', 'Accounts', 'Capture', 'SetupStop', 'ReleaseTag') {
            powershell -NoProfile -ExecutionPolicy Bypass -File "tests/$test.Tests.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test.Tests.ps1 failed" }
          }
          python tests/AccountData.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'AccountData.Tests.py failed' }
          python tests/LeagueData.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'LeagueData.Tests.py failed' }
          python tests/LeagueArt.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'LeagueArt.Tests.py failed' }
          python tests/Capture.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Capture.Tests.py failed' }
      - name: Translations
        run: python tools/missing-translations.py

  linux-mod-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mod install, update, settings and uninstall
        shell: pwsh
        run: |
          ./tests/ModBrowser.Tests.ps1
          ./tests/ContentBridge.Tests.ps1
          python3 ./tests/LeagueData.Tests.py
          python3 ./tests/LeagueArt.Tests.py
