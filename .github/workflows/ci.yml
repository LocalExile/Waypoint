# Every push to main and every pull request: the solution builds without warnings, the tests and the adapter's checks pass,
# all interface text has a translation in every catalog, and the Linux app builds into an AppImage that starts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build Waypoint.slnx -c Release
      - name: Test
        run: dotnet test Waypoint.slnx -c Release --no-build
      - name: Core checks
        run: dotnet run --project tests/Launcher.Checks -c Release --no-build
      - name: Adapter checks
        shell: pwsh
        run: |
          foreach ($test in 'Bridge', 'Mods', 'ModControl', 'ModBrowser', 'ContentBridge', 'ModTransport', 'Source', 'Accounts', 'Capture', 'SetupStop', 'ReleaseTag') {
            powershell -NoProfile -ExecutionPolicy Bypass -File "tests/$test.Tests.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test.Tests.ps1 failed" }
          }
          python tests/AccountData.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'AccountData.Tests.py failed' }
          python tests/LeagueData.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'LeagueData.Tests.py failed' }
          python tests/LeagueArt.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'LeagueArt.Tests.py failed' }
          python tests/Capture.Tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Capture.Tests.py failed' }
      - name: Translations
        run: python tools/missing-translations.py

  linux-mod-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mod install, update, settings and uninstall
        shell: pwsh
        run: |
          ./tests/ModBrowser.Tests.ps1
          ./tests/ContentBridge.Tests.ps1
          python3 ./tests/LeagueData.Tests.py
          python3 ./tests/LeagueArt.Tests.py

  # The Linux app (Waypoint.Linux.slnx) builds without warnings, and tools/build-appimage.sh packs it as the release would,
  # with every downloaded tool held to its SHA-256. The AppImage then draws its window with no display (--render) on a
  # throwaway folder that looks like a checkout, which is how it is checked to start. The AppImage is kept with the run, for
  # trying a pull request on Linux; a release never takes it from here (release.yml builds its own from the tag).
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Waypoint.Linux.slnx -c Release
      - name: AppImage
        run: tools/build-appimage.sh 0.0.0-dev out/linux
      - name: It starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WAYPOINT_HOME: ${{ runner.temp }}/waypoint-home
        run: |
          fixture="$RUNNER_TEMP/checkout"
          mkdir -p "$fixture/scripts/dev" "$WAYPOINT_HOME"
          touch "$fixture/GameServer.slnx" "$fixture/scripts/dev/live.ps1"
          out/linux/Waypoint-x86_64.AppImage "$fixture" --render "$RUNNER_TEMP/window.png" "" 3
          test -s "$RUNNER_TEMP/window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: Waypoint-x86_64.AppImage
          path: |
            out/linux/Waypoint-x86_64.AppImage
            out/linux/Waypoint-x86_64.AppImage.sha256
