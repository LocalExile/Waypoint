# Every push to main and every pull request: the solution builds without warnings and the tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build LocalExileLauncher.slnx -c Release
      - name: Test
        run: dotnet test LocalExileLauncher.slnx -c Release --no-build
